<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a2e">SafeCO Architecture</text>

  <!-- Row 1: Scheduler -> Simulator -> Modbus Server -->
  <rect x="40" y="80" width="220" height="70" rx="10" fill="#e8f4fd" stroke="#2196F3" stroke-width="2"/>
  <text x="150" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">Scheduler /</text>
  <text x="150" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">Attack Tool</text>

  <line x1="260" y1="115" x2="340" y2="115" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="340" y="80" width="220" height="70" rx="10" fill="#e8f4fd" stroke="#2196F3" stroke-width="2"/>
  <text x="450" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">Deterministic</text>
  <text x="450" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">Plant Simulator</text>

  <line x1="560" y1="115" x2="640" y2="115" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="640" y="80" width="220" height="70" rx="10" fill="#e8f4fd" stroke="#2196F3" stroke-width="2"/>
  <text x="750" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">Modbus TCP</text>
  <text x="750" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">Server (pymodbus)</text>

  <!-- Vertical arrow down -->
  <line x1="750" y1="150" x2="750" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Row 2: EventStore -> Detector -> AlertStore -->
  <rect x="640" y="200" width="220" height="70" rx="10" fill="#fff3e0" stroke="#FF9800" stroke-width="2"/>
  <text x="750" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">SQLite</text>
  <text x="750" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">EventStore</text>
  <text x="750" y="260" text-anchor="middle" font-size="10" fill="#E65100">(SHA-256 hash chain)</text>

  <line x1="640" y1="235" x2="560" y2="235" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="340" y="200" width="220" height="70" rx="10" fill="#fce4ec" stroke="#E91E63" stroke-width="2"/>
  <text x="450" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#880E4F">Layered</text>
  <text x="450" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#880E4F">Detector</text>
  <text x="450" y="260" text-anchor="middle" font-size="10" fill="#880E4F">(5 detection layers)</text>

  <line x1="340" y1="235" x2="260" y2="235" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="40" y="200" width="220" height="70" rx="10" fill="#fce4ec" stroke="#E91E63" stroke-width="2"/>
  <text x="150" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#880E4F">SQLite</text>
  <text x="150" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#880E4F">AlertStore</text>

  <!-- Vertical arrow down from AlertStore -->
  <line x1="150" y1="270" x2="150" y2="320" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- ChangeBus -->
  <rect x="340" y="320" width="220" height="50" rx="10" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2"/>
  <text x="450" y="350" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B5E20">ChangeBus</text>
  <text x="450" y="363" text-anchor="middle" font-size="10" fill="#1B5E20">(SSE push on state change)</text>

  <!-- Vertical arrow down from ChangeBus -->
  <line x1="450" y1="370" x2="450" y2="420" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Row 3: FastAPI + Dashboard -->
  <rect x="40" y="420" width="820" height="100" rx="10" fill="#f3e5f5" stroke="#9C27B0" stroke-width="2"/>
  <text x="450" y="450" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A148C">FastAPI + Operator Dashboard</text>
  <text x="450" y="475" text-anchor="middle" font-size="12" fill="#6A1B9A">Plant State | Alerts | Events | Scenarios | System Health</text>
  <text x="450" y="495" text-anchor="middle" font-size="11" fill="#7B1FA2">Vanilla HTML/CSS/JS — no build step</text>
  <text x="450" y="510" text-anchor="middle" font-size="10" fill="#9C27B0">Advisory only: reads state, records acknowledgement, never controls plant</text>

  <!-- Legend -->
  <rect x="40" y="545" width="20" height="12" rx="2" fill="#e8f4fd" stroke="#2196F3" stroke-width="1"/>
  <text x="68" y="555" font-size="11" fill="#333">Command source / simulator</text>

  <rect x="260" y="545" width="20" height="12" rx="2" fill="#fff3e0" stroke="#FF9800" stroke-width="1"/>
  <text x="288" y="555" font-size="11" fill="#333">Data storage</text>

  <rect x="420" y="545" width="20" height="12" rx="2" fill="#fce4ec" stroke="#E91E63" stroke-width="1"/>
  <text x="448" y="555" font-size="11" fill="#333">Detection / alerting</text>

  <rect x="620" y="545" width="20" height="12" rx="2" fill="#e8f5e9" stroke="#4CAF50" stroke-width="1"/>
  <text x="648" y="555" font-size="11" fill="#333">Live update bus</text>

  <rect x="780" y="545" width="20" height="12" rx="2" fill="#f3e5f5" stroke="#9C27B0" stroke-width="1"/>
  <text x="808" y="555" font-size="11" fill="#333">User interface</text>
</svg>