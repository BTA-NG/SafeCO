[project]
name = "safeco"
version = "0.1.0"
description = "Local-first, advisory cybersecurity monitor for industrial control systems (ICS)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "DIZZTROYER", email = "dizzyking037@gmail.com"},
    {name = "Cyber-Freak999", email = "cyberfreak999@protonmail.com"},
    {name = "EbiScott", email = "egbejuleeworitse@gmail.com"},
    {name = "AJ-legends", email = "alamujosephlegacy@gmail.com"},
]
maintainers = [
    {name = "DIZZTROYER", email = "dizzyking037@gmail.com"},
]
keywords = ["ics", "cybersecurity", "modbus", "water-treatment", "scada", "hackathon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
[project.urls]
Homepage = "https://github.com/BTA-NG/SafeCO"
Repository = "https://github.com/BTA-NG/SafeCO"
Issues = "https://github.com/BTA-NG/SafeCO/issues"
dependencies = [
    "pytest>=8.0,<9.0",
    "pymodbus>=3.7,<3.8",
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.21,<0.31",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.4",
    "httpx>=0.28,<0.29",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "D"]
ignore = ["D105", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"src/safeco/plant.py" = ["D"]
"src/safeco/events.py" = ["D"]
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "D107"]
